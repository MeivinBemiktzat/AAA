name: YouTube Video Finder

on:
  workflow_dispatch:
  push:
    paths:
      - 'videos.txt'

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Search YouTube
        shell: bash
        run: |
          python <<'PYTHON'
          import yt_dlp
          import time
          import re
          from difflib import SequenceMatcher
          from pathlib import Path

          input_file = Path("videos.txt")
          output_file = Path("links.txt")

          if not input_file.exists():
              raise SystemExit("videos.txt not found")

          names = [
              line.strip()
              for line in input_file.read_text(encoding="utf-8-sig").splitlines()
              if line.strip()
          ]

          options = {
              "quiet": True,
              "no_warnings": True,
              "extract_flat": True,
              "skip_download": True,
              "ignoreerrors": True,
              "retries": 3,
              "socket_timeout": 30,
          }

          def normalize(text):
              text = text.lower()
              text = re.sub(r"[^\w\s]", " ", text)
              return " ".join(text.split())

          def similarity(query, title):
              q = normalize(query)
              t = normalize(title)

              direct = SequenceMatcher(None, q, t).ratio()

              q_words = set(q.split())
              t_words = set(t.split())

              if not q_words or not t_words:
                  return direct

              overlap = len(q_words & t_words) / len(q_words)

              return 0.65 * direct + 0.35 * overlap

          results = []

          with yt_dlp.YoutubeDL(options) as ydl:
              for index, name in enumerate(names, 1):
                  print(f"[{index}/{len(names)}] Searching: {name}")

                  results.append("=" * 70)
                  results.append(f"חיפוש: {name}")
                  results.append("=" * 70)

                  try:
                      data = ydl.extract_info(
                          f"ytsearch30:{name}",
                          download=False
                      )

                      videos = data.get("entries", []) if data else []
                      candidates = []
                      seen_ids = set()

                      for video in videos:
                          if not video:
                              continue

                          title = video.get("title", "")
                          video_id = video.get("id")

                          if not title or not video_id:
                              continue

                          if video_id in seen_ids:
                              continue

                          seen_ids.add(video_id)

                          score = similarity(name, title)

                          candidates.append({
                              "title": title,
                              "id": video_id,
                              "score": score,
                              "channel": (
                                  video.get("channel")
                                  or video.get("uploader")
                                  or "לא ידוע"
                              ),
                          })

                      candidates.sort(
                          key=lambda video: video["score"],
                          reverse=True
                      )

                      top_videos = candidates[:15]

                      if not top_videos:
                          results.append("לא נמצאו תוצאות.\n")
                          continue

                      for rank, video in enumerate(top_videos, 1):
                          url = (
                              "https://www.youtube.com/watch?v="
                              + video["id"]
                          )

                          results.append(f"\n{rank}. {video['title']}")
                          results.append(f"ערוץ: {video['channel']}")
                          results.append(f"קישור: {url}")
                          results.append(
                              f"דמיון לכותרת: {video['score']:.0%}"
                          )

                          print(f"  {rank}. {video['title']}")

                      results.append("")

                  except Exception as error:
                      print(f"Search failed for {name}: {error}")
                      results.append(f"שגיאה בחיפוש: {error}\n")

                  time.sleep(2)

          output_file.write_text(
              "\n".join(results),
              encoding="utf-8"
          )

          print(f"Saved results to {output_file}")
          PYTHON

      - name: Commit results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add links.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update YouTube video links"
            git push
          fi

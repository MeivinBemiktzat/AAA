name: Download Links and Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          mkdir -p downloads

      - name: Download all files from links.txt
        run: |
          set -e

          if [ ! -f links.txt ]; then
            echo "ERROR: links.txt was not found!"
            exit 1
          fi

          COUNT=0

          while IFS= read -r URL || [ -n "$URL" ]; do

            # Remove Windows CR
            URL="${URL%$'\r'}"

            # Skip empty lines
            [ -z "$URL" ] && continue

            # Skip comments
            case "$URL" in
              \#*) continue ;;
            esac

            COUNT=$((COUNT + 1))

            echo "Downloading #$COUNT:"
            echo "$URL"

            FILENAME=$(basename "${URL%%\?*}")

            if [ -z "$FILENAME" ] || [ "$FILENAME" = "/" ] || [ "$FILENAME" = "." ]; then
              FILENAME="file_$COUNT"
            fi

            ORIGINAL="$FILENAME"
            NUMBER=1

            while [ -e "downloads/$FILENAME" ]; do
              EXT="${ORIGINAL##*.}"

              if [ "$EXT" = "$ORIGINAL" ]; then
                FILENAME="${ORIGINAL}_${NUMBER}"
              else
                BASE="${ORIGINAL%.*}"
                FILENAME="${BASE}_${NUMBER}.${EXT}"
              fi

              NUMBER=$((NUMBER + 1))
            done

            curl \
              -L \
              --fail \
              --retry 3 \
              --retry-all-errors \
              -o "downloads/$FILENAME" \
              "$URL"

            if [ ! -s "downloads/$FILENAME" ]; then
              echo "ERROR: Download failed: $URL"
              exit 1
            fi

            echo "Saved: $FILENAME"

          done < links.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No valid links found in links.txt!"
            exit 1
          fi

          echo "Downloaded $COUNT files."

      - name: Create APP.ZIP
        run: |
          cd downloads
          zip -r ../APP.ZIP .
          cd ..

          echo "APP.ZIP created:"
          unzip -l APP.ZIP

      - name: Generate release tag
        id: release
        run: |
          TAG="release-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Creating release: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Release ${{ steps.release.outputs.tag }}"
          generate_release_notes: true
          files: APP.ZIP

name: Search APKs by Name and Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          mkdir -p downloads
          sudo apt-get update -y
          sudo apt-get install -y zip unzip

      - name: Search and download APKs
        run: |
          set -e

          if [ ! -f links.txt ]; then
            echo "ERROR: links.txt was not found!"
            exit 1
          fi

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          COUNT=0
          FAILED=0
          MIN_SIZE=102400   # 100 KB: anything smaller is not a real APK

          SITES=(
            "https://www.apkmirror.com/?s="
            "https://apkpure.com/search?q="
            "https://www.apkmonk.com/search/?q="
          )

          # Returns 0 only if the file is big enough and starts with the ZIP magic "PK"
          is_real_apk() {
            local f="$1"
            [ -s "$f" ] || return 1
            local size
            size=$(stat -c%s "$f")
            [ "$size" -lt "$MIN_SIZE" ] && return 1
            local magic
            magic=$(head -c 2 "$f")
            [ "$magic" = "PK" ] || return 1
            return 0
          }

          while IFS= read -r NAME || [ -n "$NAME" ]; do
            NAME="${NAME%$'\r'}"
            NAME="$(echo "$NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            [ -z "$NAME" ] && continue
            case "$NAME" in
              \#*) continue ;;
            esac

            COUNT=$((COUNT + 1))
            echo "=============================="
            echo "Searching #$COUNT: $NAME"

            QUERY=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote_plus(sys.argv[1]))" "$NAME")
            FOUND=""
            TMP="tmp_candidate.apk"

            for SITE in "${SITES[@]}"; do
              SEARCH_URL="${SITE}${QUERY}"
              echo "Trying: $SEARCH_URL"

              PAGE=$(curl -sL --max-time 30 -A "$UA" "$SEARCH_URL" || true)
              [ -z "$PAGE" ] && continue

              # Show Cloudflare/bot-block pages so we know the site is unusable
              if echo "$PAGE" | grep -qi "just a moment"; then
                echo "BLOCKED by Cloudflare: $SEARCH_URL"
                continue
              fi

              echo "DEBUG: links containing keyword:"
              echo "$PAGE" | grep -oE 'href="[^"]+"' | grep -i "$(echo "$NAME" | sed -E 's/[[:space:]]+[0-9][0-9.]*$//' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')" | head -n 10 || true

              ORIGIN=$(echo "$SITE" | sed -E 's#(https?://[^/]+).*#\1#')

              # Keyword from the app name, without the version number (e.g. "Catan Classic 4.8.3" -> "catan-classic")
              KEYWORD=$(echo "$NAME" | sed -E 's/[[:space:]]+[0-9][0-9.]*$//' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

              DETAILS=$(echo "$PAGE" \
                | grep -oE 'href="[^"]+"' \
                | sed 's/href="//;s/"$//' \
                | grep -iE '/(apk|app|download)/' \
                | grep -i "$KEYWORD" \
                | grep -v -iE 'search|login|register|javascript|#' \
                | head -n 5 || true)

              for DETAIL in $DETAILS; do
                case "$DETAIL" in
                  http*) DETAIL_URL="$DETAIL" ;;
                  /*)    DETAIL_URL="${ORIGIN}${DETAIL}" ;;
                  *)     continue ;;
                esac

                echo "Detail page: $DETAIL_URL"
                DETAIL_PAGE=$(curl -sL --max-time 30 -A "$UA" "$DETAIL_URL" || true)
                [ -z "$DETAIL_PAGE" ] && continue

                APK_LINK=$(echo "$DETAIL_PAGE" \
                  | grep -oE 'href="[^"]+\.apk(\?[^"]*)?"' \
                  | sed 's/href="//;s/"$//' \
                  | head -n 1 || true)

                [ -z "$APK_LINK" ] && continue

                case "$APK_LINK" in
                  http*) CANDIDATE="$APK_LINK" ;;
                  /*)    CANDIDATE="${ORIGIN}${APK_LINK}" ;;
                  *)     continue ;;
                esac

                rm -f "$TMP"
                curl -L --fail --max-time 300 -A "$UA" -o "$TMP" "$CANDIDATE" || true

                if is_real_apk "$TMP"; then
                  FOUND="$CANDIDATE"
                  echo "Valid APK link: $FOUND"
                  break 2
                else
                  echo "Rejected (not a real APK): $CANDIDATE"
                  rm -f "$TMP"
                fi
              done
            done

            if [ -z "$FOUND" ]; then
              echo "WARNING: No valid APK found for: $NAME"
              FAILED=$((FAILED + 1))
              continue
            fi

            SAFE_NAME=$(echo "$NAME" | tr ' ' '_' | tr -cd 'A-Za-z0-9_.-')
            FILENAME="${SAFE_NAME}.apk"
            N=1
            while [ -e "downloads/$FILENAME" ]; do
              FILENAME="${SAFE_NAME}_${N}.apk"
              N=$((N + 1))
            done

            mv "$TMP" "downloads/$FILENAME"
            echo "Saved: $FILENAME"

          done < links.txt

          echo "=============================="
          echo "Processed $COUNT apps, failed $FAILED."

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No app names found in links.txt!"
            exit 1
          fi

          if [ -z "$(ls -A downloads)" ]; then
            echo "ERROR: No APKs were downloaded."
            exit 1
          fi

      - name: Create APP.ZIP
        run: |
          cd downloads
          zip -r ../APP.ZIP .
          cd ..
          echo "APP.ZIP created:"
          unzip -l APP.ZIP

      - name: Generate release tag
        id: release
        run: |
          TAG="release-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Creating release: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Release ${{ steps.release.outputs.tag }}"
          generate_release_notes: true
          files: APP.ZIP

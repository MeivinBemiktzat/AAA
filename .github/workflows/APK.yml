name: Search APKs by Name and Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          mkdir -p downloads
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Search and download APKs
        run: |
          set -e

          if [ ! -f links.txt ]; then
            echo "ERROR: links.txt was not found!"
            exit 1
          fi

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          COUNT=0
          FAILED=0
          MIN_SIZE=102400   # 100 KB: anything smaller is not a real APK

          SITES=(
            "https://www.apkmirror.com/?post_type=app_release&searchtype=apk&s="
            "https://apkpure.com/search?q="
            "https://www.apkmonk.com/search/?q="
          )

          # A real APK/XAPK is a ZIP file: big enough and starts with "PK" (504b).
          # HTML block pages fail this check.
          is_real_apk_file() {
            local f="$1"
            [ -s "$f" ] || return 1
            [ "$(stat -c%s "$f")" -ge "$MIN_SIZE" ] || return 1
            [ "$(head -c 2 "$f" | od -An -tx1 | tr -d ' \n')" = "504b" ]
          }

          # Browser helper (same idea as downloadViaTab in the extension's background.js):
          # open the page in a real Chromium, click downloadButton, save the file.
          cat > fetch_browser.py <<'PYEOF'
          import sys
          from playwright.sync_api import sync_playwright

          url, out = sys.argv[1], sys.argv[2]
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              ctx = browser.new_context(user_agent=UA, accept_downloads=True)
              page = ctx.new_page()
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  btn = page.locator("a.downloadButton").first
                  if btn.count() == 0:
                      print(f"no downloadButton on page: {page.url}")
                      sys.exit(2)
                  with page.expect_download(timeout=90000) as info:
                      btn.click()
                  info.value.save_as(out)
                  print(f"saved {out}")
              except Exception as e:
                  print(f"browser download failed: {e}")
                  try:
                      print(f"last page: {page.url}")
                  except Exception:
                      pass
                  sys.exit(1)
              finally:
                  browser.close()
          PYEOF

          while IFS= read -r NAME || [ -n "$NAME" ]; do
            NAME="${NAME%$'\r'}"
            NAME="$(echo "$NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            [ -z "$NAME" ] && continue
            case "$NAME" in
              \#*) continue ;;
            esac

            COUNT=$((COUNT + 1))
            echo "=============================="
            echo "Searching #$COUNT: $NAME"

            # links.txt holds one package id per line, e.g. com.exozet.android.catan
            PKG="$NAME"
            if ! echo "$PKG" | grep -qE '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z0-9_]+)+$'; then
              echo "WARNING: not a package id (expected like com.example.app): $NAME"
              FAILED=$((FAILED + 1))
              continue
            fi
            DISPLAY="$PKG"

            QUERY=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote_plus(sys.argv[1]))" "$PKG")
            FOUND=""
            TMP="tmp_candidate.apk"

            for SITE in "${SITES[@]}"; do
              SEARCH_URL="${SITE}${QUERY}"
              echo "Trying: $SEARCH_URL"

              PAGE=$(curl -sL --max-time 30 -A "$UA" "$SEARCH_URL" || true)
              [ -z "$PAGE" ] && continue

              # Show Cloudflare/bot-block pages so we know the site is unusable
              if echo "$PAGE" | grep -qi "just a moment"; then
                echo "BLOCKED by Cloudflare: $SEARCH_URL"
                continue
              fi

              ORIGIN=$(echo "$SITE" | sed -E 's#(https?://[^/]+).*#\1#')

              # Release links from the results, the way apkmirror.js list() reads them
              RELEASES=$(echo "$PAGE" \
                | grep -oE 'class="fontBlack" href="/apk/[^"]+/"' \
                | sed -E 's/.*href="([^"]+)"/\1/' || true)

              # Group by app: /apk/<dev>/<app>/ (first 3 apps, as in apkmirror.js)
              APP_BASES=$(echo "$RELEASES" \
                | sed -E 's#^(/apk/[^/]+/[^/]+/)[^/]+/$#\1#' \
                | awk '!seen[$0]++' | head -n 3 || true)

              for BASE in $APP_BASES; do
                # Check the first release of this app for our exact package (hasPackage)
                FIRST=$(echo "$RELEASES" | grep -F "$BASE" | head -n 1 || true)
                [ -z "$FIRST" ] && continue
                echo "Checking app: ${ORIGIN}${BASE}"
                PAGE_FIRST=$(curl -sL --max-time 30 -A "$UA" "${ORIGIN}${FIRST}" || true)
                [ -z "$PAGE_FIRST" ] && continue

                PKG_ESC=$(echo "$PKG" | sed 's/\./\\./g')
                if ! echo "$PAGE_FIRST" | grep -qE "details\?id=${PKG_ESC}(\"|&)"; then
                  echo "Skipped: package $PKG is not on this app"
                  continue
                fi
                echo "Package confirmed on: ${ORIGIN}${BASE}"

                # Every release of this app, newest first (up to 3 releases)
                for REL in $(echo "$RELEASES" | grep -F "$BASE" | head -n 3); do
                  DETAIL_PAGE=$(curl -sL --max-time 30 -A "$UA" "${ORIGIN}${REL}" || true)
                  [ -z "$DETAIL_PAGE" ] && continue

                  # The variant list: download-page links (like parseVariantRows)
                  VARIANT=$(echo "$DETAIL_PAGE" \
                    | grep -oE 'href="/apk/[^"]+-download/"' \
                    | sed 's/href="//;s/"$//' \
                    | head -n 1 || true)
                  [ -z "$VARIANT" ] && continue

                # APKMirror's file only starts inside a real browser, so the browser
                # clicks the downloadButton and saves the file (see fetch_browser.py).
                VARIANT_URL="${ORIGIN}${VARIANT}"
                echo "Browser download: $VARIANT_URL"
                rm -f "$TMP"
                if python3 fetch_browser.py "$VARIANT_URL" "$TMP" && is_real_apk_file "$TMP"; then
                  FOUND="$VARIANT_URL"
                  echo "Valid APK downloaded in browser: $FOUND"
                  break 3
                else
                  echo "Browser download failed for: $VARIANT_URL"
                  rm -f "$TMP"
                fi
              done
              done
            done

            if [ -z "$FOUND" ]; then
              echo "WARNING: No valid APK found for: $NAME"
              FAILED=$((FAILED + 1))
              continue
            fi

            SAFE_NAME=$(echo "$DISPLAY" | tr ' ' '_' | tr -cd 'A-Za-z0-9_.-')
            FILENAME="${SAFE_NAME}.apk"
            N=1
            while [ -e "downloads/$FILENAME" ]; do
              FILENAME="${SAFE_NAME}_${N}.apk"
              N=$((N + 1))
            done

            mv "$TMP" "downloads/$FILENAME"
            echo "Saved: $FILENAME"

          done < links.txt

          echo "=============================="
          echo "Processed $COUNT apps, failed $FAILED."

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No app names found in links.txt!"
            exit 1
          fi

          if [ -z "$(ls -A downloads)" ]; then
            echo "ERROR: No APKs were downloaded."
            exit 1
          fi

      - name: Create APP.ZIP
        run: |
          cd downloads
          zip -r ../APP.ZIP .
          cd ..
          echo "APP.ZIP created:"
          unzip -l APP.ZIP

      - name: Generate release tag
        id: release
        run: |
          TAG="release-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Creating release: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Release ${{ steps.release.outputs.tag }}"
          generate_release_notes: true
          files: APP.ZIP

name: Search APKs by Name and Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          mkdir -p downloads
          sudo apt-get update -y
          sudo apt-get install -y zip unzip

      - name: Search and download APKs
        run: |
          set -e

          if [ ! -f links.txt ]; then
            echo "ERROR: links.txt was not found!"
            exit 1
          fi

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          COUNT=0
          FAILED=0
          MIN_SIZE=102400   # 100 KB: anything smaller is not a real APK

          SITES=(
            "https://www.apkmirror.com/?s="
            "https://apkpure.com/search?q="
            "https://www.apkmonk.com/search/?q="
          )

          # Reads only the first 8 bytes of a URL (like probeFile in lib/net.js).
          # A real APK/XAPK starts with the ZIP signature "PK"; HTML block pages do not.
          probe_apk_url() {
            local url="$1"
            local head
            head=$(curl -sL --max-time 25 -r 0-7 -A "$UA" "$url" | head -c 2 | od -An -tx1 | tr -d ' \n')
            [ "$head" = "504b" ]
          }

          while IFS= read -r NAME || [ -n "$NAME" ]; do
            NAME="${NAME%$'\r'}"
            NAME="$(echo "$NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            [ -z "$NAME" ] && continue
            case "$NAME" in
              \#*) continue ;;
            esac

            COUNT=$((COUNT + 1))
            echo "=============================="
            echo "Searching #$COUNT: $NAME"

            # Format in links.txt: "Display name | com.package.id"
            PKG="${NAME#*|}"
            PKG="$(echo "$PKG" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            DISPLAY="${NAME%%|*}"
            DISPLAY="$(echo "$DISPLAY" | sed 's/[[:space:]]*$//')"
            if [ "$PKG" = "$NAME" ] || [ -z "$PKG" ]; then
              echo "WARNING: line must be 'Name | package.id': $NAME"
              FAILED=$((FAILED + 1))
              continue
            fi

            QUERY=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote_plus(sys.argv[1]))" "$PKG")
            FOUND=""
            TMP="tmp_candidate.apk"

            for SITE in "${SITES[@]}"; do
              SEARCH_URL="${SITE}${QUERY}"
              echo "Trying: $SEARCH_URL"

              PAGE=$(curl -sL --max-time 30 -A "$UA" "$SEARCH_URL" || true)
              [ -z "$PAGE" ] && continue

              # Show Cloudflare/bot-block pages so we know the site is unusable
              if echo "$PAGE" | grep -qi "just a moment"; then
                echo "BLOCKED by Cloudflare: $SEARCH_URL"
                continue
              fi

              ORIGIN=$(echo "$SITE" | sed -E 's#(https?://[^/]+).*#\1#')

              # Candidate app pages from the results (apkmirror /apk/<dev>/<app>/...)
              DETAILS=$(echo "$PAGE" \
                | grep -oE 'href="/apk/[^"]+"' \
                | sed 's/href="//;s/"$//' \
                | grep -v -iE 'search|login|register|javascript|#|/apk/[^/]+/$' \
                | sed 's/\/$//' | sort -u | head -n 5 || true)

              for DETAIL in $DETAILS; do
                DETAIL_URL="${ORIGIN}${DETAIL}/"
                echo "Detail page: $DETAIL_URL"
                DETAIL_PAGE=$(curl -sL --max-time 30 -A "$UA" "$DETAIL_URL" || true)
                [ -z "$DETAIL_PAGE" ] && continue

                # Confirm this app page is really for our package (like apkmirror.js hasPackage)
                PKG_ESC=$(echo "$PKG" | sed 's/\./\\./g')
                if ! echo "$DETAIL_PAGE" | grep -qE "details\?id=${PKG_ESC}(\"|&)"; then
                  echo "Skipped (package $PKG not on this page)"
                  continue
                fi

                # The variant list: take the first download-page link (like parseVariantRows)
                VARIANT=$(echo "$DETAIL_PAGE" \
                  | grep -oE 'href="/apk/[^"]+-download/"' \
                  | sed 's/href="//;s/"$//' \
                  | head -n 1 || true)
                [ -z "$VARIANT" ] && continue

                VARIANT_PAGE=$(curl -sL --max-time 30 -A "$UA" "${ORIGIN}${VARIANT}" || true)
                # The real file is behind the downloadButton (like apkmirror.js resolve)
                BTN=$(echo "$VARIANT_PAGE" | grep -oE '<a[^>]*class="[^"]*downloadButton[^"]*"[^>]*>' | head -n 1 || true)
                HREF=$(echo "$BTN" | grep -oE 'href="[^"]+"' | sed 's/href="//;s/"$//' | sed 's/&amp;/\&/g')
                [ -z "$HREF" ] && continue

                case "$HREF" in
                  http*) CANDIDATE="$HREF" ;;
                  /*)    CANDIDATE="${ORIGIN}${HREF}" ;;
                  *)     continue ;;
                esac

                if probe_apk_url "$CANDIDATE"; then
                  rm -f "$TMP"
                  curl -L --fail --max-time 300 -A "$UA" -o "$TMP" "$CANDIDATE" || true
                  FOUND="$CANDIDATE"
                  echo "Valid APK link: $FOUND"
                  break 2
                else
                  echo "Rejected (not a ZIP/APK): $CANDIDATE"
                fi
              done
            done

            if [ -z "$FOUND" ]; then
              echo "WARNING: No valid APK found for: $NAME"
              FAILED=$((FAILED + 1))
              continue
            fi

            SAFE_NAME=$(echo "$DISPLAY" | tr ' ' '_' | tr -cd 'A-Za-z0-9_.-')
            FILENAME="${SAFE_NAME}.apk"
            N=1
            while [ -e "downloads/$FILENAME" ]; do
              FILENAME="${SAFE_NAME}_${N}.apk"
              N=$((N + 1))
            done

            mv "$TMP" "downloads/$FILENAME"
            echo "Saved: $FILENAME"

          done < links.txt

          echo "=============================="
          echo "Processed $COUNT apps, failed $FAILED."

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No app names found in links.txt!"
            exit 1
          fi

          if [ -z "$(ls -A downloads)" ]; then
            echo "ERROR: No APKs were downloaded."
            exit 1
          fi

      - name: Create APP.ZIP
        run: |
          cd downloads
          zip -r ../APP.ZIP .
          cd ..
          echo "APP.ZIP created:"
          unzip -l APP.ZIP

      - name: Generate release tag
        id: release
        run: |
          TAG="release-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Creating release: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Release ${{ steps.release.outputs.tag }}"
          generate_release_notes: true
          files: APP.ZIP

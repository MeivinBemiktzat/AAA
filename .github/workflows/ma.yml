name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (gdown, yt-dlp, ffmpeg, aria2, zip)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]" gdown

          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 zip

      - name: Prepare directory
        run: |
          mkdir -p downloads

      - name: Download all links from links.txt
        shell: bash
        run: |
          set -u

          if [ ! -f links.txt ]; then
            echo "ERROR: links.txt was not found in the root directory!"
            exit 1
          fi

          COUNT=0
          SUCCESS=0
          FAILED=0

          while IFS= read -r URL || [ -n "$URL" ]; do
            # ניקוי רווחים ותווי ירידת שורה
            URL="${URL%$'\r'}"
            URL="$(echo "$URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            # דילוג על שורות ריקות והערות
            [ -z "$URL" ] && continue
            [[ "$URL" =~ ^# ]] && continue

            # ניקוי תגיות markdown וסוגריים
            URL="$(printf '%s\n' "$URL" | sed -E 's/^\[[^]]*\]\((https?:\/\/[^)]*)\)$/\1/')"
            URL="${URL#<}"
            URL="${URL%>}"

            COUNT=$((COUNT + 1))
            echo ""
            echo "=========================================="
            echo "Processing Link #$COUNT: $URL"
            echo "=========================================="

            DOWNLOAD_OK=0

            # זיהוי קישור של גוגל דרייב
            if [[ "$URL" == *"drive.google.com"* ]]; then
              echo "Google Drive link detected. Downloading with gdown..."
              
              if gdown "$URL" -O downloads/; then
                DOWNLOAD_OK=1
              fi
            else
              # קישור רגיל (YouTube / אתרים אחרים)
              echo "General video link detected. Downloading with yt-dlp..."
              if yt-dlp \
                --no-playlist \
                --retries 5 \
                --fragment-retries 5 \
                --restrict-filenames \
                --merge-output-format mp4 \
                -f "bv*[height<=1080]+ba/b[height<=1080]/best" \
                -o "downloads/%(title)s_${COUNT}.%(ext)s" \
                "$URL"; then
                DOWNLOAD_OK=1
              fi
            fi

            if [ "$DOWNLOAD_OK" -eq 1 ]; then
              SUCCESS=$((SUCCESS + 1))
              echo "SUCCESS: Link #$COUNT downloaded."
            else
              FAILED=$((FAILED + 1))
              echo "FAILED: Link #$COUNT could not be downloaded."
            fi

          done < links.txt

          echo ""
          echo "=========================================="
          echo "DOWNLOAD SUMMARY"
          echo "=========================================="
          echo "Total: $COUNT | Succeeded: $SUCCESS | Failed: $FAILED"
          echo "=========================================="

          if [ "$SUCCESS" -eq 0 ]; then
            echo "ERROR: No files were downloaded successfully!"
            exit 1
          fi

          echo "Files in downloads directory:"
          ls -lah downloads

      - name: Create APP.ZIP
        run: |
          if [ ! -d downloads ] || [ -z "$(ls -A downloads)" ]; then
            echo "ERROR: downloads directory is empty!"
            exit 1
          fi

          echo "Compressing files into APP.ZIP..."
          cd downloads
          zip -r ../APP.ZIP .
          cd ..

          echo ""
          echo "=========================================="
          echo "APP.ZIP CREATED SUCCESSFULLY"
          echo "=========================================="
          ls -lh APP.ZIP

      - name: Generate release tag
        id: release
        shell: bash
        run: |
          TAG="release-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Release ${{ steps.release.outputs.tag }}"
          generate_release_notes: true
          files: |
            APP.ZIP

      - name: Done
        run: |
          echo "Workflow finished successfully. Release created with APP.ZIP!"

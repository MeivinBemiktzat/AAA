name: Download File and Create Release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "קישור ישיר לקובץ להורדה"
        required: true
        type: string
      release_tag:
        description: "תגית למהדורה (לדוגמה v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Download file
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          set -e

          echo "Downloading from:"
          echo "$DOWNLOAD_URL"

          curl -L --fail --retry 3 \
            -o downloaded_file \
            "$DOWNLOAD_URL"

          if [ ! -s downloaded_file ]; then
            echo "Download failed or file is empty."
            exit 1
          fi

          echo "Downloaded successfully."

      - name: Detect filename
        run: |
          URL="${{ inputs.download_url }}"

          FILENAME=$(basename "${URL%%\?*}")

          if [ -z "$FILENAME" ] || [ "$FILENAME" = "/" ] || [ "$FILENAME" = "." ]; then
            FILENAME="downloaded_file"
          fi

          mv downloaded_file "$FILENAME"

          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

          echo "File name: $FILENAME"

      - name: Create APP.ZIP
        run: |
          zip -j APP.ZIP "$FILENAME"

          echo "Created APP.ZIP:"
          ls -lh APP.ZIP

          echo "ZIP contents:"
          unzip -l APP.ZIP

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Release ${{ inputs.release_tag }}"
          generate_release_notes: true
          files: |
            APP.ZIP

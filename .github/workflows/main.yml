name: Download Videos and Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp, ffmpeg, aria2 and deno
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]"

          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Prepare
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          mkdir -p downloads

          if [ -n "${YT_COOKIES}" ]; then
            printf '%s\n' "${YT_COOKIES}" > cookies.txt
            chmod 600 cookies.txt
            echo "cookies.txt created from YT_COOKIES secret."
          else
            echo "No YT_COOKIES secret set."
            echo "YouTube may block some downloads."
          fi

      - name: Check installed tools
        run: |
          echo "yt-dlp:"
          yt-dlp --version

          echo "ffmpeg:"
          ffmpeg -version | head -n 1

          echo "aria2:"
          aria2c --version | head -n 1

          echo "Deno:"
          deno --version

      - name: Download all videos from links.txt
        shell: bash
        run: |
          set -u

          if [ ! -f links.txt ]; then
            echo "ERROR: links.txt was not found!"
            exit 1
          fi

          COUNT=0
          SUCCESS=0
          FAILED=0

          while IFS= read -r URL || [ -n "$URL" ]; do

            # Remove Windows CR
            URL="${URL%$'\r'}"

            # Trim leading/trailing whitespace
            URL="$(echo "$URL" | sed \
              -e 's/^[[:space:]]*//' \
              -e 's/[[:space:]]*$//')"

            # Skip empty lines
            if [ -z "$URL" ]; then
              continue
            fi

            # Skip comments
            case "$URL" in
              \#*)
                continue
                ;;
            esac

            # -----------------------------------------------------
            # Convert Markdown link:
            #
            # [https://example.com](https://example.com)
            #
            # into:
            #
            # https://example.com
            # -----------------------------------------------------

            case "$URL" in
              \[*\]\(*\))
                URL="$(printf '%s\n' "$URL" | sed -E 's/^\[[^]]*\]\((https?:\/\/[^)]*)\)$/\1/')"
                ;;
            esac

            # -----------------------------------------------------
            # Remove < > around URL if present
            # -----------------------------------------------------

            case "$URL" in
              \<https://*\>)
                URL="${URL#<}"
                URL="${URL%>}"
                ;;
              \<http://*\>)
                URL="${URL#<}"
                URL="${URL%>}"
                ;;
            esac

            # -----------------------------------------------------
            # Validate URL without using Bash regex
            # -----------------------------------------------------

            case "$URL" in
              http://*|https://*)
                ;;
              *)
                echo "Skipping invalid line:"
                echo "$URL"
                echo ""
                continue
                ;;
            esac

            COUNT=$((COUNT + 1))

            echo ""
            echo "=========================================="
            echo "Downloading video #$COUNT"
            echo "URL: $URL"
            echo "=========================================="

            # -----------------------------------------------------
            # Cookies
            # -----------------------------------------------------

            COOKIE_ARGS=()

            if [ -f cookies.txt ]; then
              COOKIE_ARGS=(
                --cookies
                cookies.txt
              )
            fi

            # -----------------------------------------------------
            # Download (try several player clients as fallback)
            #
            # A single client (e.g. the default one used together
            # with --remote-components ejs:github) can report a
            # video as "unavailable" while other clients can still
            # fetch it. We try a short list of clients in order and
            # only mark the video as FAILED if all of them fail.
            # -----------------------------------------------------

            CLIENTS=("web,tv" "web_embedded,web_safari" "android_vr" "ios")
            DOWNLOAD_OK=0

            for CLIENT in "${CLIENTS[@]}"; do

              echo ""
              echo "---- Trying client(s): $CLIENT ----"

              if yt-dlp \
                "${COOKIE_ARGS[@]}" \
                --extractor-args "youtube:player_client=$CLIENT" \
                --remote-components ejs:github \
                --no-playlist \
                --retries 5 \
                --fragment-retries 5 \
                --retry-sleep 2 \
                --restrict-filenames \
                --merge-output-format mp4 \
                --concurrent-fragments 8 \
                --downloader aria2c \
                --downloader-args "aria2c:-x16 -s16 -k1M" \
                -f "bv*[height<=1080]+ba/b[height<=1080]/best" \
                -o "downloads/%(title)s_${COUNT}.%(ext)s" \
                "$URL"
              then
                DOWNLOAD_OK=1
                break
              else
                echo ""
                echo "Client(s) '$CLIENT' failed for this video, trying next option..."
              fi

            done

            if [ "$DOWNLOAD_OK" -eq 1 ]; then

              SUCCESS=$((SUCCESS + 1))

              echo ""
              echo "SUCCESS: Video #$COUNT downloaded."

            else

              FAILED=$((FAILED + 1))

              echo ""
              echo "FAILED: Video #$COUNT (all clients failed)"
              echo "URL: $URL"
              echo ""
              echo "Continuing to the next video..."

            fi

          done < links.txt

          echo ""
          echo "=========================================="
          echo "DOWNLOAD SUMMARY"
          echo "=========================================="
          echo "Links found: $COUNT"
          echo "Successful:  $SUCCESS"
          echo "Failed:      $FAILED"
          echo "=========================================="

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No valid links found in links.txt!"
            exit 1
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo "ERROR: No videos were downloaded!"
            exit 1
          fi

          echo ""
          echo "Files in downloads:"
          ls -lah downloads

      - name: Create APP.ZIP
        run: |
          if [ ! -d downloads ]; then
            echo "ERROR: downloads directory does not exist!"
            exit 1
          fi

          if [ -z "$(ls -A downloads)" ]; then
            echo "ERROR: downloads directory is empty!"
            exit 1
          fi

          cd downloads

          zip -r ../APP.ZIP .

          cd ..

          echo ""
          echo "=========================================="
          echo "APP.ZIP CREATED"
          echo "=========================================="

          ls -lh APP.ZIP

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l APP.ZIP

      - name: Generate release tag
        id: release
        shell: bash
        run: |
          TAG="release-$(date -u +'%Y%m%d-%H%M%S')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "RELEASE"
          echo "=========================================="
          echo "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Release ${{ steps.release.outputs.tag }}"
          generate_release_notes: true
          files: |
            APP.ZIP

      - name: Final summary
        run: |
          echo ""
          echo "=========================================="
          echo "WORKFLOW COMPLETED"
          echo "=========================================="
          echo "Release: ${{ steps.release.outputs.tag }}"
          echo "File: APP.ZIP"
          echo "=========================================="

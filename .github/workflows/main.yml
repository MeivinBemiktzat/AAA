name: Download Videos and Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare
        run: |
          mkdir -p downloads

      - name: Download all videos from links.txt
        run: |
          set -e

          if [ ! -f links.txt ]; then
            echo "ERROR: links.txt was not found!"
            exit 1
          fi

          COUNT=0

          while IFS= read -r URL || [ -n "$URL" ]; do

            # Remove Windows CR
            URL="${URL%$'\r'}"

            # Trim leading/trailing whitespace
            URL="$(echo "$URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            # Skip empty lines
            [ -z "$URL" ] && continue

            # Skip comments
            case "$URL" in
              \#*) continue ;;
            esac

            COUNT=$((COUNT + 1))

            echo "=============================="
            echo "Downloading video #$COUNT:"
            echo "$URL"
            echo "=============================="

            # Download the video with yt-dlp.
            # -o sets an output template that keeps the video title and index.
            # --merge-output-format mp4 merges video+audio into a single mp4.
            # --restrict-filenames avoids problematic characters in filenames.
            yt-dlp \
              --no-playlist \
              --retries 3 \
              --fragment-retries 3 \
              --restrict-filenames \
              --merge-output-format mp4 \
              -f "bestvideo+bestaudio/best" \
              -o "downloads/%(title)s_${COUNT}.%(ext)s" \
              "$URL"

            echo "Finished video #$COUNT"

          done < links.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No valid links found in links.txt!"
            exit 1
          fi

          # Make sure something was actually downloaded
          if [ -z "$(ls -A downloads)" ]; then
            echo "ERROR: No videos were downloaded!"
            exit 1
          fi

          echo "Downloaded videos from $COUNT links."
          echo "Files in downloads:"
          ls -lh downloads

      - name: Create APP.ZIP
        run: |
          cd downloads
          zip -r ../APP.ZIP .
          cd ..

          echo "APP.ZIP created:"
          unzip -l APP.ZIP

      - name: Generate release tag
        id: release
        run: |
          TAG="release-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Creating release: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Release ${{ steps.release.outputs.tag }}"
          generate_release_notes: true
          files: APP.ZIP

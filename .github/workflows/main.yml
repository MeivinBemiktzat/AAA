name: Download Videos and Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp, ffmpeg, aria2 and deno
        run: |
          python -m pip install --upgrade pip
          # Use the nightly channel so the latest YouTube fixes (EJS challenge
          # solver, etc.) are included.
          python -m pip install --upgrade --pre "yt-dlp[default]"
          sudo apt-get update
          # ffmpeg = merge video+audio ; aria2 = fast parallel downloader
          sudo apt-get install -y ffmpeg aria2
          # deno = JavaScript runtime that YouTube extraction now needs
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Prepare
        run: |
          mkdir -p downloads

          # If a YT_COOKIES secret is provided, write it to a cookies file.
          # This is what solves the "Sign in to confirm you're not a bot" error.
          if [ -n "${YT_COOKIES}" ]; then
            printf '%s\n' "${YT_COOKIES}" > cookies.txt
            echo "cookies.txt created from secret."
          else
            echo "No YT_COOKIES secret set - YouTube may block the download."
          fi
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}

      - name: Download all videos from links.txt
        run: |
          set -e

          if [ ! -f links.txt ]; then
            echo "ERROR: links.txt was not found!"
            exit 1
          fi

          COUNT=0

          while IFS= read -r URL || [ -n "$URL" ]; do

            # Remove Windows CR
            URL="${URL%$'\r'}"

            # Trim leading/trailing whitespace
            URL="$(echo "$URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            # Skip empty lines
            [ -z "$URL" ] && continue

            # Skip comments
            case "$URL" in
              \#*) continue ;;
            esac

            COUNT=$((COUNT + 1))

            echo "=============================="
            echo "Downloading video #$COUNT:"
            echo "$URL"
            echo "=============================="

            # Use cookies file only if it exists.
            COOKIE_ARGS=""
            if [ -f cookies.txt ]; then
              COOKIE_ARGS="--cookies cookies.txt"
            fi

            # Download the video with yt-dlp.
            #  * -f: best quality up to 1080p, merged into mp4 (fast enough,
            #        avoids huge 4K files while keeping HD quality).
            #  * aria2c external downloader with 16 parallel connections = fast.
            #  * --concurrent-fragments speeds up fragmented (HLS/DASH) videos.
            yt-dlp \
              $COOKIE_ARGS \
              --remote-components ejs:github \
              --no-playlist \
              --retries 3 \
              --fragment-retries 3 \
              --restrict-filenames \
              --merge-output-format mp4 \
              --concurrent-fragments 8 \
              --downloader aria2c \
              --downloader-args "aria2c:-x16 -s16 -k1M" \
              -f "bv*[height<=1080]+ba/b[height<=1080]/best" \
              -o "downloads/%(title)s_${COUNT}.%(ext)s" \
              "$URL"

            echo "Finished video #$COUNT"

          done < links.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No valid links found in links.txt!"
            exit 1
          fi

          # Make sure something was actually downloaded
          if [ -z "$(ls -A downloads)" ]; then
            echo "ERROR: No videos were downloaded!"
            exit 1
          fi

          echo "Downloaded videos from $COUNT links."
          echo "Files in downloads:"
          ls -lh downloads

      - name: Create APP.ZIP
        run: |
          cd downloads
          zip -r ../APP.ZIP .
          cd ..

          echo "APP.ZIP created:"
          unzip -l APP.ZIP

      - name: Generate release tag
        id: release
        run: |
          TAG="release-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Creating release: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: "Release ${{ steps.release.outputs.tag }}"
          generate_release_notes: true
          files: APP.ZIP

name: Download HF model and publish as GitHub Release

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: "Hugging Face repo"
        required: true
        default: "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
      hf_file:
        description: "File name to download, or 'all' to download and pack the full repository"
        required: true
        default: "all"
      release_tag:
        description: "Tag/name for the GitHub Release"
        required: true
        default: "qwen3-tts-0.6b"
      split_size_mb:
        description: "Size of each split chunk in MB"
        required: true
        default: "1800"

permissions:
  contents: write

jobs:
  fetch-split-release:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install huggingface_hub CLI
        run: pip install -U "huggingface_hub[cli]"

      - name: Download model from Hugging Face
        id: download_step
        env:
          HF_REPO: ${{ inputs.hf_repo }}
          HF_FILE: ${{ inputs.hf_file }}
        run: |
          mkdir -p ./raw_download
          mkdir -p ./download

          python3 - <<'PYEOF'
          import os
          from huggingface_hub import hf_hub_download, snapshot_download

          repo = os.environ["HF_REPO"].strip()
          file_input = os.environ.get("HF_FILE", "all").strip()

          if file_input.lower() in ["all", "*", ""]:
              print(f"Downloading full repository: {repo}")
              snapshot_download(repo_id=repo, local_dir="./raw_download")
              mode = "repo"
              target_file = "model.tar.gz"
          else:
              print(f"Downloading single file '{file_input}' from {repo}")
              hf_hub_download(repo_id=repo, filename=file_input, local_dir="./download")
              mode = "file"
              target_file = file_input

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"mode={mode}\n")
              f.write(f"target_file={target_file}\n")
          PYEOF

          if [ "${{ steps.download_step.outputs.mode }}" = "repo" ]; then
            echo "Packing repository into tar.gz..."
            tar -czf "./download/${{ steps.download_step.outputs.target_file }}" -C ./raw_download .
            rm -rf ./raw_download
          fi

          ls -lh ./download

      - name: Split the file into chunks
        run: |
          mkdir -p ./parts
          SRC="./download/${{ steps.download_step.outputs.target_file }}"
          split -b "${{ inputs.split_size_mb }}m" -d -a 3 "$SRC" "./parts/${{ steps.download_step.outputs.target_file }}.part"
          ls -lh ./parts

      - name: Create checksum manifest
        run: |
          cd ./parts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release with split parts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body: |
            Release files for `${{ inputs.hf_repo }}`.
            
            ### Restore on Windows (CMD):
            ```cmd
            copy /b ${{ steps.download_step.outputs.target_file }}.part* ${{ steps.download_step.outputs.target_file }}
            tar -xzf ${{ steps.download_step.outputs.target_file }} -C ./model_folder
            ```
          files: |
            ./parts/*

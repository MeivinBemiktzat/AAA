name: Black Cat Media Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: blackcat-media-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Download and package media
        run: python scripts/blackcat_sync.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackcat-download-report
          path: download-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate release tag
        if: success()
        id: release
        shell: bash
        run: echo "tag=blackcat-archive-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Publish separate ZIP packages
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \${{ steps.release.outputs.tag }}
          name: "Black Cat media archive \${{ steps.release.outputs.tag }}"
          generate_release_notes: false
          files: |
            APP-1.zip
            APP-2.zip
            APP-3.zip
            APP-4.zip

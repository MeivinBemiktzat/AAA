name: Download Links and Create Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          mkdir -p downloads

      - name: Download all links
        run: |
          set -e

          if [ ! -f links.txt ]; then
            echo "ERROR: links.txt was not found!"
            exit 1
          fi

          COUNT=0

          while IFS= read -r URL || [ -n "$URL" ]; do

            # התעלמות משורות ריקות
            [ -z "$URL" ] && continue

            # התעלמות משורות שמתחילות ב-#
            case "$URL" in
              \#*) continue ;;
            esac

            COUNT=$((COUNT + 1))

            echo "======================================"
            echo "Downloading #$COUNT"
            echo "$URL"

            FILENAME=$(basename "${URL%%\?*}")

            if [ -z "$FILENAME" ] || [ "$FILENAME" = "/" ] || [ "$FILENAME" = "." ]; then
              FILENAME="file_$COUNT"
            fi

            # מניעת התנגשות בשמות
            ORIGINAL="$FILENAME"
            NUMBER=1

            while [ -e "downloads/$FILENAME" ]; do

              EXT="${ORIGINAL##*.}"

              if [ "$EXT" = "$ORIGINAL" ]; then
                FILENAME="${ORIGINAL}_${NUMBER}"
              else
                BASE="${ORIGINAL%.*}"
                FILENAME="${BASE}_${NUMBER}.${EXT}"
              fi

              NUMBER=$((NUMBER + 1))
            done

            curl \
              -L \
              --fail \
              --retry 3 \
              --retry-all-errors \
              -o "downloads/$FILENAME" \
              "$URL"

            if [ ! -s "downloads/$FILENAME" ]; then
              echo "ERROR: Download failed:"
              echo "$URL"
              exit 1
            fi

            echo "Saved as: $FILENAME"

          done < links.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No links found in links.txt!"
            exit 1
          fi

          echo "======================================"
          echo "Downloaded $COUNT files."

      - name: Create APP.ZIP
        run: |
          cd downloads

          zip -r ../APP.ZIP .

          cd ..

          echo "======================================"
          echo "APP.ZIP created successfully:"
          ls -lh APP.ZIP

          echo ""
          echo "Contents:"
          unzip -l APP.ZIP

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Release ${{ inputs.release_tag }}"
          generate_release_notes: true
          files: APP.ZIP

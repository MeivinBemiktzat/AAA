name: Create Release and Upload Asset

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file
        run: |
          curl -L -o compositor-win32-x64-msvc-4.0.516.tgz https://registry.npmjs.org/@remotion/compositor-win32-x64-msvc/-/compositor-win32-x64-msvc-4.0.516.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: compositor-win32-x64-msvc-4.0.516.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

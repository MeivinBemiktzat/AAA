name: Download Gemini Extensions and Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VSIX Files
        run: |
          mkdir -p dist
          # Gemini Code Assist
          curl -L "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/Google/vsextensions/geminicodeassist/latest/vspackage" -o dist/geminicodeassist.vsix
          
          # Google Cloud Code (כולל תמיכה ב-Gemini)
          curl -L "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/GoogleCloudTools/vsextensions/cloudcode/latest/vspackage" -o dist/cloudcode.vsix

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Gemini Extensions Release #${{ github.run_number }}
          body: |
            גרסה זו מכילה את קבצי ה-VSIX של התוספים הרשמיים הורדו ישירות מ-VS Code Marketplace.
          files: |
            dist/geminicodeassist.vsix
            dist/cloudcode.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
